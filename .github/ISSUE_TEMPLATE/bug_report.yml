name: Bug report
description: Report behaviour that is wrong or surprising
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do **not** use this form — follow [SECURITY.md](../blob/master/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behaviour, including the exact tool call and the error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure with ...
        2. Call save_draft with ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: "20.11.0"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Mail provider
      description: Which IMAP/SMTP host, and whether it is Gmail, GoDaddy, Fastmail, a relay, etc.
    validations:
      required: true
  - type: dropdown
    id: send-enabled
    attributes:
      label: Was AYDU_MAIL_ALLOW_SEND enabled?
      options:
        - "No (drafting only)"
        - "Yes"
        - "Not relevant to this issue"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste tool output or errors with any credential removed.
      render: shell
    validations:
      required: false
